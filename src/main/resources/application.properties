# ===================================================================
# Retail Management Backend Configuration
# ===================================================================

server.port=${PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:retail_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Sathwik@184}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# MongoDB Configuration (Product Reviews)
# -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/retail_reviews}

# -------------------------------------------------------------------
# Jackson JSON Serialization
# -------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
